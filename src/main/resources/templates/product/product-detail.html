<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layouts/layout :: head(${product.name})}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="main-wrapper">
    <div style="margin-bottom: 20px;">
        <a th:href="@{/products}" style="display:inline-flex; align-items:center; gap:6px; color: var(--text-muted); font-size: 14px; font-weight: 600;">
            &larr; Quay lại danh sách sản phẩm
        </a>
    </div>

    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-sm); display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
        <!-- Left: Image -->
        <div style="border-radius: var(--radius-md); overflow: hidden; background: #f1f5f9; max-height: 440px; display: flex; align-items: center; justify-content: center;">
            <img th:src="${product.image != null and !#strings.isEmpty(product.image) ? product.image : '/images/product-default.png'}"
                 th:alt="${product.name}"
                 style="width: 100%; height: 100%; object-fit: cover;"
                 onerror="this.src='/images/product-default.png'" />
        </div>

        <!-- Right: Details -->
        <div style="display: flex; flex-direction: column;">
            <div style="font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">
                Mã SP: #<span th:text="${product.id}">1</span>
            </div>

            <h1 style="font-size: 28px; line-height: 1.2; margin-bottom: 16px; color: var(--text-main);" th:text="${product.name}">
                Tên sản phẩm
            </h1>

            <div style="font-size: 30px; font-weight: 800; color: #16a34a; margin-bottom: 20px;">
                <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</span>
            </div>

            <div style="border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 20px 0; margin-bottom: 24px;">
                <h3 style="font-size: 15px; margin-bottom: 10px; color: var(--text-main);">Mô tả chi tiết:</h3>
                <p style="color: var(--text-muted); font-size: 14.5px; white-space: pre-line; line-height: 1.7;" th:text="${product.description}">
                    Mô tả sản phẩm...
                </p>
            </div>

            <!-- Seller Info -->
            <div style="background: var(--surface-alt); padding: 16px 20px; border-radius: var(--radius-md); margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 44px; height: 44px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 18px;">
                        👤
                    </div>
                    <div>
                        <div style="font-size: 12px; color: var(--text-muted);">Người đăng bán</div>
                        <div style="font-weight: 700; color: var(--text-main);" th:text="${product.userFullName}">Tên người bán</div>
                        <div style="font-size: 12px; color: var(--text-muted);" th:text="${product.userEmail}">email@example.com</div>
                    </div>
                </div>

                <div style="font-size: 12px; color: var(--text-sub);"
                     th:text="${#temporals.format(product.createdAt, 'dd/MM/yyyy HH:mm')}">
                    01/01/2026
                </div>
            </div>

            <!-- Actions -->
            <div style="display: flex; gap: 12px; margin-top: auto;">
                <th:block sec:authorize="isAuthenticated()">
                    <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')') or #authentication.principal.id == product.userId}">
                        <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-secondary" style="flex:1;">
                            ✏️ Chỉnh sửa sản phẩm
                        </a>

                        <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post" style="display:inline;"
                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-danger">
                                🗑️ Xóa
                            </button>
                        </form>
                    </th:block>
                </th:block>

                <a th:href="@{/products}" class="btn btn-secondary">
                    Quay lại
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
