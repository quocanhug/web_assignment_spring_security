<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div style="font-size: 36px; margin-bottom: 8px;">🛡️</div>
            <h1>Đặt Lại Mật Khẩu</h1>
            <p>
                Nhập mã OTP đã gửi đến email:<br/>
                <strong style="color: var(--primary);" th:text="${resetPasswordDTO.email}">email@example.com</strong>
            </p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Đã xảy ra lỗi</span>
        </div>

        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{email}" />

            <div class="form-group">
                <label class="form-label" for="otp">Mã xác thực OTP (6 chữ số) *</label>
                <input type="text" id="otp" th:field="*{otp}" maxlength="6"
                       class="input-control" style="font-size: 20px; font-weight: 700; letter-spacing: 4px; text-align: center;"
                       placeholder="••••••" autofocus required />
                <div class="form-error" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="newPassword">Mật khẩu mới *</label>
                <input type="password" id="newPassword" th:field="*{newPassword}" class="input-control"
                       placeholder="Ít nhất 6 ký tự" required />
                <div class="form-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới *</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="input-control"
                       placeholder="Nhập lại mật khẩu mới" required />
                <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="padding: 12px; margin-top: 8px;">
                Cập Nhật Mật Khẩu Mới
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 13.5px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 18px;">
            Chưa nhận được mã?
            <a th:href="@{/resend-otp(email=${resetPasswordDTO.email}, type='FORGOT_PASSWORD')}"
               style="font-weight: 700; color: var(--primary);">Gửi lại mã OTP</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
