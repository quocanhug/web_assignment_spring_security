<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Xác thực mã OTP')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div style="font-size: 36px; margin-bottom: 8px;">📩</div>
            <h1>Xác Thực Mã OTP</h1>
            <p>
                Mã xác thực gồm 6 chữ số đã được gửi đến email:<br/>
                <strong style="color: var(--primary);" th:text="${verifyOtpDTO.email}">user@example.com</strong>
            </p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span th:text="${successMessage}">Thành công</span>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Mã OTP không đúng hoặc hết hạn</span>
        </div>

        <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{email}" />
            <input type="hidden" th:field="*{type}" />

            <div class="form-group" style="text-align: center;">
                <label class="form-label" for="otp" style="margin-bottom: 12px;">Nhập mã 6 chữ số:</label>
                <input type="text" id="otp" th:field="*{otp}" maxlength="6"
                       class="input-control"
                       style="font-size: 28px; font-weight: 800; letter-spacing: 8px; text-align: center; max-width: 240px; margin: 0 auto; display: block;"
                       placeholder="••••••" autofocus required />
                <div class="form-error" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="padding: 12px; margin-top: 16px;">
                Xác Nhận Kích Hoạt
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 13.5px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 18px;">
            Không nhận được mã?
            <a th:href="@{/resend-otp(email=${verifyOtpDTO.email}, type=${verifyOtpDTO.type})}"
               style="font-weight: 700; color: var(--primary);">Gửi lại mã OTP</a>
        </div>

        <div style="margin-top: 16px; background: #fefce8; border: 1px solid #fef08a; padding: 12px; border-radius: var(--radius-sm); font-size: 12px; color: #854d0e; text-align: center;">
            💡 <em>Lưu ý: Nếu SMTP chưa được cấu hình, mã OTP cũng được in ngay trên Console của ứng dụng để kiểm tra.</em>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
