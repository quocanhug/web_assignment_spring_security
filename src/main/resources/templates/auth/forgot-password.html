<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div style="font-size: 36px; margin-bottom: 8px;">🔑</div>
            <h1>Quên Mật Khẩu?</h1>
            <p>Nhập email đăng ký của bạn để nhận mã xác thực OTP đặt lại mật khẩu</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Đã xảy ra lỗi</span>
        </div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label class="form-label" for="email">Địa chỉ Email đã đăng ký</label>
                <input type="email" id="email" th:field="*{email}" class="input-control"
                       placeholder="Ví dụ: user@gmail.com" required autofocus />
                <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="padding: 12px; margin-top: 8px;">
                Gửi mã xác thực OTP qua Email
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 13.5px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 18px;">
            Nhớ lại mật khẩu?
            <a th:href="@{/login}" style="font-weight: 700; color: var(--primary);">Quay lại đăng nhập</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
