<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng ký tài khoản')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
        <div class="auth-header">
            <div style="font-size: 36px; margin-bottom: 8px;">📝</div>
            <h1>Tạo Tài Khoản Mới</h1>
            <p>Đăng ký để tham gia và mua bán sản phẩm tại UTEShop</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Đã xảy ra lỗi</span>
        </div>

        <form th:action="@{/register}" th:object="${registerDTO}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label class="form-label" for="fullName">Họ và tên *</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="input-control"
                       placeholder="Ví dụ: Nguyễn Văn A" required />
                <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label class="form-label" for="username">Tên đăng nhập *</label>
                    <input type="text" id="username" th:field="*{username}" class="input-control"
                           placeholder="username" required />
                    <div class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Địa chỉ Email *</label>
                    <input type="email" id="email" th:field="*{email}" class="input-control"
                           placeholder="name@gmail.com" required />
                    <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu *</label>
                    <input type="password" id="password" th:field="*{password}" class="input-control"
                           placeholder="Tối thiểu 6 ký tự" required />
                    <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu *</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="input-control"
                           placeholder="Nhập lại mật khẩu" required />
                    <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="avatarFile">Ảnh đại diện (Upload Cloudinary)</label>
                <input type="file" id="avatarFile" name="avatarFile" class="input-control"
                       accept="image/*" onchange="previewImage(this, 'avatarPreview')" />
                <div class="preview-box" id="avatarPreviewContainer" style="display: none;">
                    <img id="avatarPreview" src="" alt="Preview Avatar" />
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="padding: 12px; margin-top: 10px;">
                Đăng ký &amp; Nhận mã OTP qua Email
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 13.5px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 18px;">
            Đã có tài khoản?
            <a th:href="@{/login}" style="font-weight: 700; color: var(--primary);">Đăng nhập ngay</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
function previewImage(input, previewId) {
    if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById(previewId).src = e.target.result;
            document.getElementById(previewId + 'Container').style.display = 'flex';
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>

</body>
</html>
