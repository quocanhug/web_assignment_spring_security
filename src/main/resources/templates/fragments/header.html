<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header" class="topbar">
    <!-- Brand -->
    <div class="brand">
        <a th:href="@{/}">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>UTEShop</span>
        </a>
        <span class="brand-badge">Security 7</span>
    </div>

    <!-- Main Navigation -->
    <nav class="nav-links">
        <a th:href="@{/}" class="nav-item" th:classappend="${activeNav == 'home' ? 'active' : ''}">
            <span>🏠 Trang chủ</span>
        </a>
        <a th:href="@{/products}" class="nav-item" th:classappend="${activeNav == 'products' ? 'active' : ''}">
            <span>📦 Sản phẩm</span>
        </a>
        <a sec:authorize="isAuthenticated()" th:href="@{/products/new}" class="nav-item" th:classappend="${activeNav == 'new-product' ? 'active' : ''}">
            <span>➕ Thêm sản phẩm</span>
        </a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}" class="nav-item" th:classappend="${activeNav == 'admin-users' ? 'active' : ''}">
            <span>👥 Quản lý người dùng</span>
        </a>
    </nav>

    <!-- User Authentication Area -->
    <div class="account-area">
        <!-- Logged in state -->
        <div th:if="${#authorization.expression('isAuthenticated()')}" class="user-badge">
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.svg'}"
                 alt="Avatar" class="avatar"
                 onerror="this.src='/images/avatar-default.svg'" />

            <div class="user-details">
                <div style="display:flex; align-items:center; gap:6px;">
                    <span class="user-name" th:text="${#authentication.principal.fullName}">Họ và Tên</span>
                    <span class="user-meta" th:text="'(' + ${#authentication.principal.username} + ')'">(@user)</span>
                </div>
                <div class="user-meta">
                    <span th:text="${#authentication.principal.email}">email@example.com</span>
                    <span>&bull;</span>
                    <span class="role-tag"
                          th:classappend="${#strings.contains(#authentication.principal.role, 'ADMIN') ? 'admin' : ''}"
                          th:text="${#authentication.principal.role}">ROLE_USER</span>
                </div>
            </div>

            <!-- Logout Form with CSRF -->
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 8px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-logout" title="Đăng xuất khỏi hệ thống">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Thoát</span>
                </button>
            </form>
        </div>

        <!-- Anonymous / Guest state -->
        <div th:unless="${#authorization.expression('isAuthenticated()')}" style="display:flex; gap:10px;">
            <a th:href="@{/login}" class="btn btn-secondary btn-sm">Đăng nhập</a>
            <a th:href="@{/register}" class="btn btn-primary btn-sm">Đăng ký</a>
        </div>
    </div>
</header>

</body>
</html>
