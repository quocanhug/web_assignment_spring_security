<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Truy cập bị từ chối (403)')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="main-wrapper" style="text-align: center; padding: 80px 20px;">
    <div style="max-width: 500px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 48px; box-shadow: var(--shadow-lg);">
        <div style="font-size: 64px; margin-bottom: 16px;">🚫</div>
        <h1 style="font-size: 32px; color: var(--danger); margin-bottom: 12px;">403 Forbidden</h1>
        <h2 style="font-size: 18px; color: var(--text-main); margin-bottom: 16px;">Truy Cập Bị Từ Chối</h2>
        <p style="color: var(--text-muted); font-size: 14.5px; line-height: 1.6; margin-bottom: 28px;">
            Bạn không có đủ quyền hạn hoặc vai trò để truy cập vào tài nguyên này. Vui lòng đăng nhập bằng tài khoản có quyền Quản trị viên (ADMIN) hoặc quay lại trang chủ.
        </p>
        <div style="display: flex; gap: 12px; justify-content: center;">
            <a th:href="@{/}" class="btn btn-primary">Về Trang Chủ</a>
            <a th:href="@{/login}" class="btn btn-secondary">Đăng nhập tài khoản khác</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
