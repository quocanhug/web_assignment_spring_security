<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${isEdit ? 'Chỉnh sửa người dùng' : 'Thêm người dùng mới'})}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="main-wrapper">
    <div class="page-header">
        <div class="page-title">
            <h1 th:text="${isEdit ? '✏️ Chỉnh Sửa Người Dùng' : '➕ Thêm Người Dùng Mới'}">Người dùng</h1>
            <p th:text="${isEdit ? 'Cập nhật quyền hạn, thông tin cá nhân và ảnh đại diện' : 'Tạo mới tài khoản người dùng hoặc quản trị viên'}"></p>
        </div>
        <a th:href="@{/admin/users}" class="btn btn-secondary">
            &larr; Quay lại danh sách
        </a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span th:text="${errorMessage}">Lỗi</span>
    </div>

    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; max-width: 680px; box-shadow: var(--shadow-sm);">
        <form th:action="${isEdit ? '/admin/users/edit/' + userFormDTO.id : '/admin/users/new'}"
              th:object="${userFormDTO}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" th:if="${isEdit}" />
            <input type="hidden" th:field="*{images}" th:if="${isEdit}" />

            <div class="form-group">
                <label class="form-label" for="fullName">Họ và tên *</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="input-control"
                       placeholder="Ví dụ: Nguyễn Văn A" required />
                <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label" for="username">Tên đăng nhập *</label>
                    <input type="text" id="username" th:field="*{username}" class="input-control"
                           placeholder="username" required />
                    <div class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Địa chỉ Email *</label>
                    <input type="email" id="email" th:field="*{email}" class="input-control"
                           placeholder="user@example.com" required />
                    <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    Mật khẩu <span th:if="${isEdit}">(để trống nếu không muốn đổi)</span><span th:unless="${isEdit}">*</span>
                </label>
                <input type="password" id="password" th:field="*{password}" class="input-control"
                       placeholder="Nhập mật khẩu..." th:required="${!isEdit}" />
                <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label" for="roleId">Vai trò hệ thống *</label>
                    <select id="roleId" th:field="*{roleId}" class="input-control" required>
                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}">ROLE_USER</option>
                    </select>
                </div>

                <div class="form-group" style="display:flex; flex-direction:column; justify-content:center;">
                    <label class="form-label">Trạng thái kích hoạt</label>
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-top:8px;">
                        <input type="checkbox" th:field="*{enabled}" style="width:18px; height:18px;" />
                        <span style="font-size:14px; font-weight:600;">Kích hoạt tài khoản</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="imageFile">Ảnh đại diện (Upload Cloudinary)</label>
                <input type="file" id="imageFile" name="imageFile" class="input-control"
                       accept="image/*" onchange="previewImage(this, 'userAvatarPreview')" />

                <div class="preview-box" id="userAvatarPreviewContainer"
                     th:style="${isEdit and userFormDTO.images != null ? 'display:flex' : 'display:none'}">
                    <img id="userAvatarPreview"
                         th:src="${isEdit and userFormDTO.images != null ? userFormDTO.images : ''}"
                         alt="Preview Avatar" />
                </div>
            </div>

            <div style="display:flex; gap:12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">
                    <span th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo người dùng'}">Lưu</span>
                </button>
                <a th:href="@{/admin/users}" class="btn btn-secondary">Hủy bỏ</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
function previewImage(input, previewId) {
    if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById(previewId).src = e.target.result;
            document.getElementById(previewId + 'Container').style.display = 'flex';
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>

</body>
</html>
