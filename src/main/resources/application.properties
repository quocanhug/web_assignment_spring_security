# =============================================================
# ENVIRONMENT & CONFIG IMPORT
# =============================================================
spring.config.import=optional:file:.env[.properties]
spring.application.name=web_assignment_spring_security
spring.main.allow-bean-definition-overriding=true
server.port=${SERVER_PORT:8080}

# =============================================================
# SQL SERVER DATABASE CONFIGURATION
# =============================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=web_spring_security;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:1234@a$}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =============================================================
# JPA / HIBERNATE CONFIGURATION
# =============================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true

# =============================================================
# THYMELEAF CONFIGURATION
# =============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =============================================================
# MULTIPART FILE UPLOAD
# =============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/

# =============================================================
# CLOUDINARY CONFIGURATION (Loaded from .env)
# =============================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# =============================================================
# MAIL / SMTP CONFIGURATION (Loaded from .env)
# =============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
